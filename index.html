<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F2 Math Hero V50.2</title><link rel="stylesheet" href="css/v50-core.css"></head><body><main class="shell"><section class="hero"><h1>F2 Math Hero V50.2</h1><p>Stable core with chapters, student records, combo rewards and wrong-book review.</p></section><section id="loginView" class="panel hidden"><div class="field"><label for="nameInput">Student name</label><input id="nameInput" autocomplete="name" placeholder="Enter student name"></div><div class="row" style="margin-top:14px"><button id="loginBtn" class="btn">Start Game</button></div></section><section id="lobbyView" class="panel hidden"><div class="topbar"><div><div class="muted">Player</div><strong id="playerName"></strong></div><div class="row"><span class="stat">XP: <strong id="playerXp">0</strong></span><span class="stat">Coins: <strong id="playerCoins">0</strong></span><span class="stat">Correct: <strong id="playerCorrect">0</strong></span><span class="stat">Wrong: <strong id="playerWrong">0</strong></span><button id="wrongBookBtn" class="btn secondary">Wrong Book</button><button id="switchBtn" class="btn secondary">Switch Student</button></div></div><div id="chapterGrid" class="chapter-grid"></div><p class="footer-note">Each student keeps separate XP, coins, chapter progress and wrong answers on this device.</p></section><section id="gameView" class="panel hidden"><div class="topbar"><div><strong id="chapterTitle">Chapter</strong><div id="questionNo" class="muted"></div></div><div class="row"><span class="stat">Combo: <strong id="comboValue">0</strong></span><button id="backBtn" class="btn secondary">Back to Chapters</button></div></div><div class="progress"><div id="progressBar"></div></div><p id="questionText" class="question"></p><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="row" style="margin-top:16px"><button id="checkBtn" class="btn">Check Answer</button><button id="nextBtn" class="btn hidden">Next Question</button></div></section><section id="wrongBookView" class="panel hidden"><div class="topbar"><div><strong>Wrong Book</strong><div id="wrongBookSummary" class="muted"></div></div><button id="wrongBookBackBtn" class="btn secondary">Back to Chapters</button></div><div id="wrongBookList" class="wrong-list"></div></section></main><script src="js/v50-core.js"></script></body></html>
