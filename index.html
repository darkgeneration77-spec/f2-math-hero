<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F2 Math Hero V50.1</title><link rel="stylesheet" href="css/v50-core.css"></head><body><main class="shell"><section class="hero"><h1>F2 Math Hero V50.1</h1><p>Stable core: login, chapters, questions, progress and XP.</p></section><section id="loginView" class="panel hidden"><div class="field"><label for="nameInput">Student name</label><input id="nameInput" autocomplete="name" placeholder="Enter student name"></div><div class="row" style="margin-top:14px"><button id="loginBtn" class="btn">Start Game</button></div></section><section id="lobbyView" class="panel hidden"><div class="topbar"><div><div class="muted">Player</div><strong id="playerName"></strong></div><div class="row"><span class="stat">XP: <strong id="playerXp">0</strong></span><button id="switchBtn" class="btn secondary">Switch Student</button></div></div><div id="chapterGrid" class="chapter-grid"></div><p class="footer-note">Chapter 1 contains the first migrated questions. Chapter 2–13 use the same stable engine and are ready for full question-bank migration.</p></section><section id="gameView" class="panel hidden"><div class="topbar"><div><strong id="chapterTitle">Chapter</strong><div id="questionNo" class="muted"></div></div><button id="backBtn" class="btn secondary">Back to Chapters</button></div><div class="progress"><div id="progressBar"></div></div><p id="questionText" class="question"></p><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="row" style="margin-top:16px"><button id="checkBtn" class="btn">Check Answer</button><button id="nextBtn" class="btn hidden">Next Question</button></div></section></main><script src="js/v50-core.js"></script></body></html>
